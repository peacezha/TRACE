name: hpclaw-web
services:
  hpclaw:
    build: .
    image: trace-web:0.5.16
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${TRACE_BIND_IP:-127.0.0.1}:${TRACE_PORT:-3003}:3003"
    environment:
      TRACE_WEB_ORIGIN: "${TRACE_WEB_ORIGIN:-http://127.0.0.1:3003}"
      TRACE_WEB_COOKIE_SECURE: "${TRACE_WEB_COOKIE_SECURE:-0}"
      TRACE_TRUST_PROXY: "${TRACE_TRUST_PROXY:-0}"
    volumes:
      - hpclaw-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hpclaw-data:
