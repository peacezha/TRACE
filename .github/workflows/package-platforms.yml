name: Package Mac installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Add verified artifacts to the release matching package.json
        type: boolean
        default: true
      include_private_web:
        description: Also build the optional single-user private web package
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: trace-platforms
  cancel-in-progress: false
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - name: Download the pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Read package version
        run: node -e "console.log('TRACE_PACKAGE_VERSION=' + require('./package.json').version)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npx vitest run electron/local-files.test.ts server/webAccess.test.ts scripts/web-runtime-config.test.ts src/components/WebPanelDrawer.test.tsx src/components/Terminal.test.tsx server/workflows/paperWorkflowGeneration.test.ts server/workflows/paperPublicData.test.ts server/workflows/paperModelTransport.test.ts server/workflows/paperLearningPrompt.test.ts --maxWorkers 1 --minWorkers 1
      - name: Verify chat, continuous execution and workflow dependencies
        run: npx vitest run src/components/AIChat.test.tsx src/components/WorkflowRunCard.test.tsx src/components/FlowRunnerDrawer.test.tsx src/components/WorkflowFlowGraph.test.tsx src/features/workflows/flowGraphLayout.test.ts shared/workflowExecution.test.ts shared/workflowDependencies.test.ts shared/workflowCatalog.test.ts server/ai/jobWakeQueue.test.ts server/ai/legacyJobResumer.test.ts server/dsh/dshJobResumer.test.ts server/dsh/dshTranslate.test.ts server/dsh/jobAgentBindings.test.ts server/notifications/jobWatcher.test.ts server/workflows/formalWorkflowContinuations.test.ts server/workflows/runAnnotate.test.ts server/workflows/workflowRunService.test.ts server/workflows/chipseqDag.test.ts --maxWorkers 1 --minWorkers 1
      - run: npm run prepare:platform
      - run: ulimit -n 65536 && npm run electron:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/smoke-macos.mjs
      - name: Record build source
        run: node -e "require('fs').writeFileSync('release-mac-${{ matrix.arch }}/TRACE-${{ env.TRACE_PACKAGE_VERSION }}-platforms-mac-${{ matrix.arch }}.json',JSON.stringify({version:process.env.TRACE_PACKAGE_VERSION,arch:process.arch,sourceCommit:process.env.GITHUB_SHA,appleSigned:false},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release-mac-${{ matrix.arch }}/*.dmg
            release-mac-${{ matrix.arch }}/*.zip
            release-mac-${{ matrix.arch }}/*.json
          if-no-files-found: error
          compression-level: 0
  web:
    if: inputs.include_private_web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - name: Read package version
        run: node -e "console.log('TRACE_PACKAGE_VERSION=' + require('./package.json').version)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npx vitest run electron/local-files.test.ts server/webAccess.test.ts scripts/web-runtime-config.test.ts src/components/WebPanelDrawer.test.tsx src/components/Terminal.test.tsx --maxWorkers 1 --minWorkers 1
      - run: npm run prepare:platform
      - run: npm run build:web
      - run: node scripts/smoke-web.mjs
      - name: Verify deployment container
        run: |
          cd release-web/TRACE-${{ env.TRACE_PACKAGE_VERSION }}-web-linux-x64
          cleanup() { docker compose logs --tail=100 hpclaw; docker compose down; }
          trap cleanup EXIT
          docker compose up -d --build --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/api/app-info)" = 401
      - uses: actions/upload-artifact@v4
        with:
          name: web-linux-x64
          path: |
            release-web/*.tar.gz
            release-web/*.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: [mac, web]
    if: always() && inputs.publish && needs.mac.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped')
    concurrency:
      group: trace-release-assets-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: actions/download-artifact@v4
        with:
          path: platform-artifacts
          merge-multiple: true
      - run: node scripts/publish-platform-assets.mjs platform-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
